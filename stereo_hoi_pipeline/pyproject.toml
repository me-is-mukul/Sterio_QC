[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-hoi-pipeline"
dynamic = ["version"]
description = "Modular, reproducible preprocessing pipeline for egocentric stereo video with HOI-based waste removal and IMU synchronization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "mediapipe==1.2.3",
    "opencv-contrib-python==5.0.0.93",
    "numpy==2.5.4",
    "mcap==1.6.0",
    "mcap-protobuf-support==0.6.0",
    "protobuf==7.36.2",
    "google-cloud-storage==3.17.1",
    "google-crc32c==1.9.0",
    "google-genai==3.6.1",
]

[project.scripts]
stereo-hoi = "video_pipeline.cli:main"
stereo-hoi-ui = "video_pipeline.web.server:main"
ego-qa-batch = "video_pipeline.ego_cli:main"

[tool.setuptools.dynamic]
version = { attr = "video_pipeline.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_pipeline = ["web/static/*.html"]
