# Egocentric video QA for MCAP recordings in Google Cloud Storage
# ("Egocentric video QA: pass / fail criteria" sheet). Used by scripts/run_gcs_batch.py.
#
# Load order (later wins): this file -> file passed with --config (only keys that exist here)
# -> CLI options. Relative paths are resolved against stereo_hoi_pipeline/.
# Decisions D1-D9 refer to talking_to_mukul.md, section 7.

gcp:
  project: datadensity
  # auto: Application Default Credentials (on the VM: its service account), else gcloud tokens.
  credentials: auto

source:
  bucket: op-datoric
  # Source and destination. Both can also be given on the command line (they then win):
  #   --source gs://<bucket>/<folder>/   sets bucket + raw_root
  #   --dest   gs://<bucket>/<folder>/   sets processed_bucket + processed_root
  # A session's result goes to <destination>/<path of the session below the source folder>/.
  raw_root: raw/                 # sessions are read from here (never written)
  processed_root: processed/     # results: processed/<path of the session below raw/>
  processed_bucket: null         # null = the same bucket as `bucket`
  session_json: session.json
  segment_pattern: '^ego_(\d+)\.mcap$'
  # Segments are STREAMED from the bucket (ranged reads of the exact listed object version), never
  # saved to disk. Read buffer per open segment:
  read_chunk_mb: 16

upload:
  enabled: true
  # A session whose qa_report.json already exists in processed/:
  #   skip           do not process it again (default; --force overrides)
  #   overwrite      process again and overwrite (needs storage.objects.delete)
  #   new_run_folder process again and write to .../<session>/runs/<run id>/
  on_existing: skip

work:
  # Local working folder: <directory>/<path of the session below raw/>/. It never holds raw video:
  # only frame/IMU index tables, the sampled JPEG frames (one per 2 s per eye), 24 full-size
  # calibration frame pairs, the reports, and one clip MP4 at a time (uploaded, then deleted).
  # With --no-upload the clips stay here.
  directory: outputs/ego_qa
  # After a successful upload, delete the working files (index, frames). The small reports are kept.
  delete_local_files_after_upload: true

tools:
  ffmpeg: ffmpeg
  ffprobe: ffprobe

topics:
  # Looked up by topic NAME in every file (channel IDs differ between files).
  cameras: [/ego/camera/0, /ego/camera/1]
  imu_raw: /ego/imu/0/raw
  intrinsics: [/ego/camera/0/intrinsics, /ego/camera/1/intrinsics]
  stereo_extrinsics: /ego/camera/1/extrinsics    # parent cam0, child cam1
  imu_info: /ego/imu/0/info
  imu_extrinsics: /ego/imu/0/extrinsics
  video_format: h265

# Section 1: technical checks (whole recording). Any failure = FAIL.
technical:
  expected_fps: 30
  fps_tolerance: 0.5             # median frame rate must be within expected_fps +/- this
  max_frame_gap_seconds: 0.1     # a longer gap between consecutive frames = irregular frame rate
  max_eye_offset_ms: 5           # left/right capture times of one frame pair (measured: ~0.01 ms)
  # One eye may start earlier / stop later by a frame or two (seen: cam1 kept 1 extra frame at the
  # end). Up to this many unpaired frames at each end are trimmed; any unpaired frame inside = FAIL.
  max_unpaired_edge_frames: 3
  imu_max_gap_seconds: 0.05
  imu_coverage_tolerance_seconds: 0.1   # IMU must start <= first frame + this and end >= last frame - this
  imu_same_clock_max_offset_seconds: 5  # first IMU sample vs first frame; larger = different clock
  imu_rate_window_seconds: 10
  imu_rate_tolerance: 0.05       # every window's sample rate within +/-5 % of the nominal rate
  black_min_seconds: 5           # blackdetect: shortest black stretch reported
  black_pixel_threshold: 0.10
  black_picture_threshold: 0.98
  freeze_noise_db: -60           # freezedetect
  freeze_min_seconds: 5
  max_defect_fraction: 0.5       # black + frozen share of the recording at/above this = FAIL
  decode_timeout_seconds: 21600
  min_recording_seconds: 30      # shorter recordings cannot yield a 30 s piece

# Section 2: stereo calibration. Decides rectified / unrectified; never fails a recording.
calibration:
  pairs: 24                      # held-out left/right frame pairs spread over the recording
  max_median_vertical_px: 1.5
  max_p95_vertical_px: 5.0
  min_inlier_matches: 200        # D7
  min_pairs_with_matches: 10     # D7
  min_matches_per_pair: 15
  ratio_test: 0.75
  ransac_threshold_px: 3.0
  # Eye order: share of matches whose horizontal disparity says cam0 is the left eye.
  eye_order_min_agreement: 0.7
  eye_order_min_points: 100
  eye_order_min_disparity_px: 1.0
  # What "as labelled" means. calibration: the side the factory calibration geometry puts each
  # camera on (on the recordings checked: cam1 = left). Or force cam0 / cam1.
  labelled_left: calibration

# Labelling of the sampled frames (section 4).
labelling:
  interval_seconds: 2
  eye: left
  image_max_width: 1280
  jpeg_quality: 85
  strip_image_width: 768
  # A model whose share of failed/invalid answers is above this stops the run with an error
  # (instead of silently keeping or passing everything).
  max_failure_ratio: 0.02

# What labels every sampled frame. `provides`: what its answers are used for.
#   hands, activity  section 4 (all models that provide one must agree before anything is cut)
#   content          section 3 (exactly one model, only when content.enabled is true)
# provider: mediapipe (hands, runs locally) | motion (activity, runs locally, no AI model)
#           | gemini | ollama | openai_compatible | env (INFERENCE_PROVIDER + its .env variables)
# Default: NO AI service at all. To use vision-language models instead, run with
#   --config configs/ego_qa_with_vlm.yaml
models:
  hands:
    provider: mediapipe          # "no hands": MediaPipe finds none of the wearer's hands
    provides: [hands]
  idle:
    provider: motion             # "idle": nothing moves (see the motion section below)
    concurrency: 4
    provides: [activity]
  # Content screen (section 3: minors, private moments, ...). NOT CONFIGURED YET. To turn it on
  # later: uncomment this block, fill in the model, and set content.enabled: true below (or pass
  # --content-screen on). See docs/ego_qa.md, "Turning on the content screen".
  # content:
  #   provider: gemini           # or ollama / openai_compatible / env
  #   model: gemini-3.5-flash
  #   location: asia-south1      # gemini only
  #   concurrency: 8
  #   provides: [content]

inference:
  timeout_seconds: 120
  max_retries: 3
  retry_backoff_seconds: 2
  temperature: 0.0
  max_output_tokens: 1024
  think: false                   # Qwen3 thinking (ollama / openai_compatible); null = model default
  frame_prompt: ego-qa-frame-v1
  recording_prompt: ego-qa-recording-v1
  clip_prompt: ego-qa-clip-v1

# MediaPipe hand detection ("no hands"). Measured on the recordings (night scene, 125 frames): it
# misses many of the wearer's hands in dark / fisheye-edge views. Checking both eyes and lowering the
# confidences from 0.5 to 0.3 raised the frames with a found hand from 22 % to 42 %, with no false
# hands on a static recording. A missed hand can cut real work, so keep these.
mediapipe:
  model_path: models/hand_landmarker.task
  both_eyes: true                # a hand found in either eye of the frame pair counts
  num_hands: 4
  min_hand_detection_confidence: 0.3
  min_hand_presence_confidence: 0.3
  min_hand_size: 0.08
  max_pointing_down: 0.5
  large_hand_size: 0.175
  duplicate_overlap: 0.6
  power_curl_deg: 120
  pinch_ratio: 0.40
  hands_without_grasp: UNCERTAIN

# Model-free idle detection (provider: motion). A sample is idle when BOTH hold:
#   * the picture barely changes from the previous and the next sample (2 s apart): the share of
#     pixels that changed by more than pixel_threshold grey levels (picture shrunk to image_width
#     pixels wide and blurred) is at most max_changed_fraction in both comparisons;
#   * the head is still: median gyroscope speed within +/-1 s is at most max_gyro_rad_s.
# Moving hands or a moving head = not idle, so footage is only cut when the wearer is inactive.
motion:
  image_width: 160
  pixel_threshold: 20
  max_changed_fraction: 0.02
  max_gyro_rad_s: 0.15

# Section 3: content screen. SWITCH: enabled (or --content-screen on|off). Off for now: it needs a
# vision-language model that is not configured yet (see the commented `content` model above).
content:
  enabled: false
  minor_min_frames: 2            # D6: frames showing a minor -> drop the recording
  third_person_max_share: 0.5    # D6: "most of the recording"
  lens_max_share: 0.5            # D6: "most of the recording"
  recording_strip_frames: 16     # frames sent together to judge "no work / staged work"
  private_min_frames: 2          # D6: frames with a private moment -> drop the clip
  clip_strip_frames: 12          # frames sent together to judge "one trivial motion repeated"

# Section 4: time cropping.
cropping:
  idle_cut_seconds: 10           # run of all-idle samples spanning >= this (t_last - t_first) is cut (D3)
  no_hands_cut_seconds: 10       # same for "no wearer hand visible" (D2: all models must agree)
  min_models_per_decision: 1     # models that must label hands/activity (the QA sheet asks for 2)
  cut_defects: true              # also cut black/frozen stretches found in section 1
  keyframe_snap_max_seconds: 1
  min_piece_seconds: 30

logging:
  console_level: INFO
  file_level: DEBUG
