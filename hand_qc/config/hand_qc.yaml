# =====================================================================================
#  Hand & Technical QC - configuration
#
#  Every threshold used for a PASS/FAIL decision lives in the `tests:` section.
#  Change a value, re-run `python run_hand_qc.py`, and only the scoring is redone
#  (seconds); the expensive video analysis is reused.
#
#  Do not edit this file for one-off experiments - copy the keys you want to change
#  into your own file and pass it with:  python run_hand_qc.py --config my_settings.yaml
#  (your file is merged on top of this one).
# =====================================================================================

paths:                                  # relative paths are relative to the hand_qc folder
  results_dir: results                  # one sub-folder per clip list: results/<name>/
  cache_dir: ../hand_qc_cache           # downloaded source videos (large; NOT part of the deliverable)
  model: models/hand_landmarker.task    # MediaPipe Hand Landmarker (float16, v1)

tools:
  ffmpeg: ffmpeg                        # name on PATH or full path (FFmpeg >= 6.0 required)
  ffprobe: ffprobe

download:
  retries: 3
  timeout_seconds: 60
  verify_md5: true                      # verified whenever the bucket publishes an MD5

# ---------------------------------------------------------------------------------------
#  Analysis (changing anything here re-runs the video analysis for every clip)
# ---------------------------------------------------------------------------------------
analysis:
  workers: 2                            # clips analysed in parallel
  # Frame stride by source frame rate: the first band with fps <= max_fps applies.
  #   ~30 fps -> every 4th frame (7.5 analysed frames/s)
  #   ~60 fps -> every 8th frame (7.5 /s)
  #  ~120 fps -> every 20th frame (6 /s)
  stride_bands:
    - {max_fps: 35, stride: 4}
    - {max_fps: 65, stride: 8}
    - {max_fps: 1000, stride: 20}
  max_view_width: 1280                  # each camera view is downscaled to at most this width for analysis
  blockiness_fps: 2                     # full-resolution frames per second used for the blockiness measure
  mediapipe:
    num_hands: 4                        # > 2 so that other people's hands are seen and reported
    min_hand_detection_confidence: 0.5
    min_hand_presence_confidence: 0.5
    min_tracking_confidence: 0.5
    # Verified on these clips: MediaPipe 1.2.3 labels the wearer's left/right hand correctly
    # on non-mirrored egocentric video, so no swap. Set true only for mirrored (selfie) footage.
    swap_handedness: false

# ---------------------------------------------------------------------------------------
#  Per-frame definitions used by the scoring
# ---------------------------------------------------------------------------------------
frame_quality:
  dark_luma: 40                         # frame mean luma (0-255) below this = too dark
  bright_luma: 220                      # frame mean luma above this = blown out
  sharp_laplacian_var: 60               # frame Laplacian variance (at analysis resolution) at/above this = sharp

wearer:
  # Hand size = diagonal of the box around the 21 landmarks / view height (robust to the hand's
  #             orientation; a hand seen edge-on keeps its size).
  # Pointing  = wrist->knuckle direction, +1 = straight down the image, -1 = straight up.
  # A detected hand is someone else's when it is
  #   - smaller than min_hand_size (far away), or
  #   - pointing down the frame more than max_pointing_down (reaching towards the camera)
  #     while smaller than large_hand_size (only the wearer's own hands get that close).
  min_hand_size: 0.08
  max_pointing_down: 0.5
  large_hand_size: 0.175
  # Six-cam tiles are mounted at arbitrary rotations, so the pointing rule is not used there.
  use_direction_rule: {mono: true, sbs: true, grid3x2: false}
  duplicate_overlap: 0.6                # boxes sharing more than this share of the smaller box = same hand

grasp:
  # Hand-shape heuristic (MediaPipe 3D hand model, view independent):
  power_curl_deg: 120                   # mean flexion of the 4 fingers (sum of 3 joints, degrees) at/above = power grasp
  pinch_ratio: 0.40                     # thumb-tip to index/middle-tip distance / palm length at/below = precision grasp
  min_duration_s: 0.3                   # a grasp must be held at least this long to count
  max_gap_s: 0.3                        # short dropouts inside a grasp are bridged

tracking:
  min_tracked_s: 0.5                    # a hand must have been tracked this long ...
  min_lost_s: 0.5                       # ... and then be missing this long to count as a tracking loss

# ---------------------------------------------------------------------------------------
#  PASS / FAIL tests.  min / max: null = reported only (no pass/fail).
# ---------------------------------------------------------------------------------------
tests:
  # Policy: hands in frame and hand-object interaction (HOI) decide the verdict; technical /
  #         tracking checks only catch clearly unusable footage. Tuned so that ~60% of the
  #         50 sample clips pass (30/50 with these values).
  # ---- technical (lenient) ----
  duration_s:           {min: 30}
  fps:                  {min: 24, tolerance: 0.1}  # accepts 23.976 and above
  bitrate_mbps:         {min_at_1080p: 1.0}         # required = min_at_1080p x (pixels / 1920x1080)
  codec:                {allowed: [h264, hevc]}
  decode_errors:        {max: 0}                    # corrupt frames are never acceptable
  luminance:            {min_mean: 30, max_mean: 230, max_bad_frame_pct: 25}
  sharpness:            {min_sharp_frame_pct: 60}
  blockiness:           {max: 8.5}                  # visible block-edge steps, percentage points (0 = none)
  colour_cast:          {max: 12, min_neutral_frame_pct: 10}  # a*/b* shift of grey/white surfaces (Lab units)
  orientation:          {allowed_rotations: [0, 90, 180, 270], min_upright_pct: 35, min_hands: 30,
                         min_hand_size: 0.12}       # near hands = largest quarter of the clip's hands (>= this size)
  # ---- hands (STRICT; camera wearer's hands; multi-camera rigs combined) ----
  either_hand_pct:      {min: 65}
  both_hands_pct:       {min: null}               # reported: many tasks are one-handed
  left_hand_pct:        {min: null}
  right_hand_pct:       {min: null}
  hoi_pct:              {min: 55}
  tracking_losses_per_min: {max: 15}                # tracker dropouts: lenient
  untracked_pct:        {max: 35}
  grasp_count:          {min: null}
  grasp_duration_s:     {min: null}
  longest_hand_gap_s:   {max: 20}
  other_hands_pct:      {max: null}                 # other people's hands (reported only)
