# Single-host GPU deployment: Ollama + dashboard + one-off pipeline runs.
#
#   docker compose up -d --build ollama dashboard
#   docker compose exec ollama ollama pull qwen3-vl:4b
#   docker compose run --rm pipeline --input /app/videos/STEREO_01.mp4 --waste-threshold 5
#   open http://<host>:8000
#
# See docs/guide.md (Part 3).

services:
  ollama:
    image: ollama/ollama:0.32.0
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Not published: only the pipeline container talks to Ollama.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  dashboard:
    build: .
    image: stereo-hoi-pipeline:0.4.1
    restart: unless-stopped
    command: ["python", "scripts/serve_ui.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output:ro

  pipeline:
    image: stereo-hoi-pipeline:0.4.1
    build: .
    profiles: ["run"]          # not started by `up`; use `docker compose run --rm pipeline ...`
    entrypoint: ["python", "scripts/run_pipeline.py"]
    environment:
      INFERENCE_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:4b}
    depends_on:
      - ollama
    volumes:
      - ./videos:/app/videos:ro
      - ./output:/app/output

volumes:
  ollama-models:
